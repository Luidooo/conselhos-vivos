# O tema do site (site/.vitepress/theme/custom.css) aplicado ao painel: mesmo azul, mesmos cinzas, mesma fonte.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#1d1d1f"
font = "sans serif"

[browser]
gatherUsageStats = false
