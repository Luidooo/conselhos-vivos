# Site de documentação: build em todo PR que mexe na documentação (o VitePress
# falha com link quebrado) e publicação no GitHub Pages a cada push no main.
name: Documentação

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'AI-USAGE.md', 'site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'AI-USAGE.md', 'site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
