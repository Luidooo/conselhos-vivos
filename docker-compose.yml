services:
  db:
    image: postgres:16.15
    # CDC por slot lógico (ADR 0002 já previa o custo; ADR 0007 descreve o uso)
    command: ["postgres", "-c", "wal_level=logical"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # só 127.0.0.1: os containers usam db:5432, e ninguém na rede alcança o banco
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ faz o Compose passar a variável para o container, em vez de interpolar
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    restart: unless-stopped
    environment:
      # modo desktop: abre direto, sem tela de login — só para uso local
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      # só 127.0.0.1: sem login, publicar na rede daria o banco a qualquer um
      - "127.0.0.1:5050:80"
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
      - source: pgadmin_pgpass
        target: /pgpass
        uid: "5050"
        gid: "0"
        mode: 0600
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy

  # Carga da planilha da pesquisadora (#3): só biblioteca padrão do Python, sem rede, só leitura.
  # Escreve SQL, relatório ou CSV no stdout; quem grava é o scripts/carga.sh (make carga).
  # O perfil impede que suba com `up`: roda com `docker compose run --rm -T carga sql`.
  carga:
    image: python:3.12.14-slim
    profiles: [carga]
    network_mode: none
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/app/src:ro
      - ./data/raw:/app/data/raw:ro
      - ./data/referencia:/app/data/referencia:ro
      - ./tests:/app/tests:ro
      - ./docs/adr/medicoes:/app/docs/adr/medicoes:ro
    entrypoint: [python, -m, planilha]

  # Recorte do SIORG para a identidade dos conselhos (#4, ADR 0004). O único com rede:
  # baixa o SIORG e escreve o recorte no stdout; quem grava é o `make siorg`. Não roda no setup.
  siorg:
    image: python:3.12.14-slim
    profiles: [siorg]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/app/src:ro
      - ./data/raw:/app/data/raw:ro
    entrypoint: [python, -m, conselhos, siorg]

  # Baixa as edições do DOU do INLABS.
  ingestor:
    image: golang:1.26.8-alpine
    profiles: [ingestor]
    working_dir: /app
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      INLABS_EMAIL: ${INLABS_EMAIL}
      INLABS_SENHA: ${INLABS_SENHA}
      INLABS_OUTPUT_DIR: /data/bronze/inlabs
      GOCACHE: /tmp/gocache
      GOMODCACHE: /tmp/gomodcache
      GOFLAGS: -mod=mod
    volumes:
      - ./src/ingestor:/app:ro
      # Fora do /app de propósito: aninhado nele, o runc precisaria criar
      # /app/data dentro de um bind :ro, e o container não sobe.
      - ./data/bronze:/data/bronze
    entrypoint: ["sh", "-c", "go build -o /tmp/fetch ./cmd/fetch && exec /tmp/fetch \"$$@\"", "--"]


  # Testes do ingestor. Tudo :ro e sem credencial no ambiente. Mantém rede — ao
  # contrário do carga — porque o GOMODCACHE nasce vazio e a primeira execução
  # precisa baixar os módulos; o que é hermético é o código de teste, que só fala
  # com httptest. Aqui os caches ficam em volume nomeado (nada é gravado no host,
  # então o dono dos arquivos não importa) e as execuções seguintes não baixam nada.
  ingestor-test:
    image: golang:1.26.8-alpine
    profiles: [ingestor]
    working_dir: /app
    environment:
      GOCACHE: /gocache
      GOMODCACHE: /gomodcache
    volumes:
      - ./src/ingestor:/app:ro
      - gocache:/gocache
      - gomodcache:/gomodcache
    entrypoint: []

  # Camada analítica em Delta Lake (ADR 0006)
  lake:
    image: python:3.12.14-slim
    profiles: [lake]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PIP_CACHE_DIR: /tmp/pipcache
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    volumes:
      - ./src:/app/src:ro
      - ./docs:/app/docs
      - ./data/silver:/data/silver
      - pipcache:/tmp/pipcache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore --no-warn-script-location -r /app/src/lake/requirements.txt && if [ \"$$1\" = \"python\" ]; then shift; exec python \"$$@\"; else python -m lake \"$${1:-/data/silver/atos}\"; rc=$$?; chown -R $${DOCKER_UID}:$${DOCKER_GID} /data/silver; exit $$rc; fi", "sh"]

  # Ingestão do DOU em Python (#52): o par dos serviços ingestor/persist em Go,
  # que vai substituí-los fatia por fatia. Mesmos moldes do lake: pip com cache
  # em volume, PG* para o banco. O bronze é gravável porque o fetch-mensal (#53)
  # escreve nele; o persist (#55) só lê.
  dou:
    image: python:3.12.14-slim
    profiles: [ingestor]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      DADOS_ABERTOS_OUTPUT_DIR: /data/bronze/dados-abertos
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PIP_CACHE_DIR: /tmp/pipcache
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    volumes:
      - ./src:/app/src:ro
      - ./data/bronze:/data/bronze
      - pipcache:/tmp/pipcache
    depends_on:
      db:
        condition: service_healthy
    # Roda como root, como o lake: o volume pipcache nasce root:root e um usuário
    # comum não grava nele. O que o fetch-mensal (#53) gravar no bronze recebe
    # chown no fim, como o lake faz com o silver.
    entrypoint: ["sh", "-c", "pip install -q --disable-pip-version-check --root-user-action=ignore --no-warn-script-location --target /tmp/site -r /app/src/dou/requirements.txt && PYTHONPATH=/app/src:/tmp/site python -m dou \"$$@\"; rc=$$?; chown -R $${DOCKER_UID}:$${DOCKER_GID} /data/bronze; exit $$rc", "sh"]

  # Testes do dou (#52). Os sem banco rodam no serviço carga (sem rede, como os
  # da planilha); estes são os que gravam no banco, cada um numa transação
  # desfeita no fim, como o internal/dbtest do Go fazia.
  dou-db-test:
    image: python:3.12.14-slim
    profiles: [ingestor]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src:/app/tests/dou_db:/tmp/site
      PYTHONDONTWRITEBYTECODE: "1"
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PIP_CACHE_DIR: /tmp/pipcache
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - pipcache:/tmp/pipcache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "pip install -q --disable-pip-version-check --root-user-action=ignore --no-warn-script-location --target /tmp/site -r /app/src/dou/requirements.txt && exec python -m unittest discover -s tests/dou_db \"$$@\"", "sh"]

  # Fluxo de mudanças OLTP -> Delta (ADR 0007): aplica no Delta o que está pendente no slot lógico.
  # Mesma imagem e volumes do lake. Argumentos: [destino] ou --drop-slot.
  cdc:
    image: python:3.12.14-slim
    profiles: [lake]
    working_dir: /app
    environment:
      PYTHONPATH: /app/src
      PYTHONDONTWRITEBYTECODE: "1"
      CDC_SLOT: ${CDC_SLOT:-conselhos_lake}
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      PIP_CACHE_DIR: /tmp/pipcache
      DOCKER_UID: ${DOCKER_UID:-1000}
      DOCKER_GID: ${DOCKER_GID:-1000}
    volumes:
      - ./src:/app/src:ro
      - ./data/silver:/data/silver
      - pipcache:/tmp/pipcache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c", "pip install -q --root-user-action=ignore --no-warn-script-location -r /app/src/lake/requirements.txt && { python -m lake.cdc \"$$@\"; rc=$$?; chown -R $${DOCKER_UID}:$${DOCKER_GID} /data/silver; exit $$rc; }", "sh"]

# servers.json e pgpass gerados a partir do .env: o pgAdmin já abre conectado no banco.
# O servers.json só é importado na 1ª subida do volume `pgadmin`; se mudar
# POSTGRES_USER ou POSTGRES_DB, rode `make pgadmin-reset`. Senha sem `:` nem `\`
# (formato do pgpass).
configs:
  pgadmin_servers:
    content: |
      {"Servers": {"1": {
        "Name": "conselhos-vivos (db)",
        "Group": "Servers",
        "Host": "db",
        "Port": 5432,
        "MaintenanceDB": "${POSTGRES_DB}",
        "Username": "${POSTGRES_USER}",
        "PassFile": "/pgpass",
        "SSLMode": "prefer"
      }}}
  pgadmin_pgpass:
    content: |
      db:5432:*:${POSTGRES_USER}:${POSTGRES_PASSWORD}

volumes:
  pgdata:
  pgadmin:
  gocache:
  gomodcache:
  pipcache:
